<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Nur Islam  CTO at SOFT HAB, Founder and CEO of HOST HAB</title>
  <desc id="desc">Professional GitHub profile banner for Nur Islam, Linux system administrator, DevOps engineer, and technology executive in Dhaka, Bangladesh.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="55%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2744"/>
      <stop offset="100%" stop-color="#0B1C33"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="460" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1E3A5F" stroke-width="1" opacity="0.28">
    <path d="M0 80 H1600 M0 160 H1600 M0 240 H1600 M0 320 H1600 M0 400 H1600"/>
    <path d="M120 0 V460 M240 0 V460 M360 0 V460 M480 0 V460 M600 0 V460 M720 0 V460 M840 0 V460 M960 0 V460 M1080 0 V460 M1200 0 V460 M1320 0 V460 M1440 0 V460"/>
  </g>

  <!-- glow orb -->
  <circle cx="1320" cy="150" r="180" fill="url(#glow)"/>
  <circle cx="1460" cy="340" r="120" fill="url(#glow)"/>

  <!-- left accent -->
  <rect x="0" y="0" width="10" height="460" fill="url(#accent)"/>

  <!-- network nodes -->
  <g fill="none" stroke="#22D3EE" stroke-width="1.6" opacity="0.7">
    <path d="M1180 120 L1288 168 L1410 128 L1488 210 L1380 268 L1270 236 L1180 120"/>
    <path d="M1288 168 L1380 268"/>
    <path d="M1410 128 L1488 210"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="1180" cy="120" r="6"/>
    <circle cx="1288" cy="168" r="8"/>
    <circle cx="1410" cy="128" r="6"/>
    <circle cx="1488" cy="210" r="7"/>
    <circle cx="1380" cy="268" r="6"/>
    <circle cx="1270" cy="236" r="5"/>
  </g>
  <g fill="#0B1220" stroke="#3B82F6" stroke-width="1.5">
    <rect x="1238" y="300" width="86" height="54" rx="8"/>
    <rect x="1340" y="318" width="86" height="54" rx="8"/>
    <rect x="1442" y="300" width="86" height="54" rx="8"/>
  </g>
  <g fill="#22D3EE" opacity="0.9">
    <rect x="1252" y="314" width="58" height="6" rx="3"/>
    <rect x="1252" y="328" width="40" height="6" rx="3"/>
    <rect x="1354" y="332" width="58" height="6" rx="3"/>
    <rect x="1354" y="346" width="40" height="6" rx="3"/>
    <rect x="1456" y="314" width="58" height="6" rx="3"/>
    <rect x="1456" y="328" width="40" height="6" rx="3"/>
  </g>

  <!-- copy -->
  <text x="64" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="4" fill="#67E8F9">DHAKA, BANGLADESH  ·  10+ YEARS</text>
  <text x="64" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#F8FAFC">Nur Islam</text>
  <rect x="68" y="192" width="220" height="6" rx="3" fill="url(#accent)"/>
  <text x="64" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#CBD5E1">CTO at SOFT HAB  ·  Founder &amp; CEO of HOST HAB</text>
  <text x="64" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#94A3B8">Linux SysAdmin  ·  DevOps  ·  Cloud  ·  WHMCS  ·  Full-Stack Engineering</text>

  <!-- chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#E2E8F0">
    <rect x="64" y="340" width="132" height="40" rx="20" fill="url(#chip)" stroke="#22D3EE" stroke-width="1"/>
    <text x="130" y="366" text-anchor="middle">cPanel / WHM</text>
    <rect x="208" y="340" width="92" height="40" rx="20" fill="url(#chip)" stroke="#3B82F6" stroke-width="1"/>
    <text x="254" y="366" text-anchor="middle">AWS</text>
    <rect x="312" y="340" width="108" height="40" rx="20" fill="url(#chip)" stroke="#22D3EE" stroke-width="1"/>
    <text x="366" y="366" text-anchor="middle">WHMCS</text>
    <rect x="432" y="340" width="132" height="40" rx="20" fill="url(#chip)" stroke="#3B82F6" stroke-width="1"/>
    <text x="498" y="366" text-anchor="middle">WordPress</text>
    <rect x="576" y="340" width="108" height="40" rx="20" fill="url(#chip)" stroke="#22D3EE" stroke-width="1"/>
    <text x="630" y="366" text-anchor="middle">Laravel</text>
    <rect x="696" y="340" width="92" height="40" rx="20" fill="url(#chip)" stroke="#3B82F6" stroke-width="1"/>
    <text x="742" y="366" text-anchor="middle">SSL</text>
  </g>
</svg>
